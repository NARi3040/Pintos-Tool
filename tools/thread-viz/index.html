<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pintos thread-viz</title>
<link rel="stylesheet" href="ui.css">
<style>
.wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
h1 { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
.sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 12px; }
@media (max-width: 800px) { .modes { grid-template-columns: 1fr; } }
.mode { display: block; text-align: left; white-space: normal; background: var(--panel); color: var(--fg); border-radius: var(--r);
  padding: 16px 20px; font-weight: 400; }
.mode:hover { background: var(--panel); box-shadow: inset 0 0 0 99px var(--weak); }
.mode.on, .mode.on:hover { background: var(--accent-soft); box-shadow: none; }
.mode b { font-size: 17px; font-weight: 700; display: block; margin-bottom: 2px; letter-spacing: -.02em; }
.mode.on b { color: var(--accent); }
.mode span { color: var(--muted); font-size: 13px; word-break: keep-all; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.group { margin-top: 16px; }
.group h3 { font-size: 13px; font-weight: 600; letter-spacing: 0; color: var(--muted); margin: 0 0 4px; display: flex; gap: 4px; align-items: center; }
.group h3 button { font-size: 13px; padding: 4px 8px; color: var(--accent); }
.sg { margin: 8px 0 0; }
.sg h4 { margin: 0; display: flex; gap: 8px; align-items: center; }
.sg h4 button { font-size: 13px; padding: 4px 8px; }
.sg h4 .note { font-weight: 400; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0 8px; }
.t { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 10px; cursor: pointer; font-size: 14px; min-width: 0;
  transition: background .15s; }
.t:hover { background: var(--sunk); }
.t span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t .res { margin-left: auto; font-size: 12px; padding: 3px 6px; border-radius: 6px; }
.prog .track { margin: 12px 0; }
.done { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--sub); }
.done span { display: inline-flex; gap: 4px; align-items: center; }
.done .ok { color: var(--ok); } .done .fail { color: var(--err); } .done .none { color: var(--muted); }
pre { max-height: 260px; overflow: auto; white-space: pre-wrap; margin: 8px 0 0; }
details { margin-top: 8px; }
.err { color: var(--err); display: inline-flex; gap: 6px; align-items: center; }
.status-msg { font-size: 15px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Pintos thread-viz</h1>
  <p class="sub">테스트를 골라 실행하면 gdb로 추적해서 뷰어에 보여줘요. 결과만 보려면 <a href="viewer.html">Project 1 뷰어</a> · <a href="uprog.html">Project 2 뷰어</a> · <a href="uprog.html?vm">Project 3 뷰어</a></p>
  <div class="modes">
    <button class="mode" data-m="threads" aria-pressed="false"><b>Project 1 — Threads</b><span>alarm, priority, mlfqs. 스레드 상태, ready_list, lock/sema 대기, donation</span></button>
    <button class="mode" data-m="userprog" aria-pressed="false"><b>Project 2 — User Programs</b><span>args, syscall, fork/exec/wait, 파일. 유저 스택, 프로세스 트리, page fault, 누수</span></button>
    <button class="mode" data-m="vm" aria-pressed="false"><b>Project 3 — Virtual Memory</b><span>lazy 로딩, swap, mmap, 스택 확장. 프로세스별 SPT·프레임, fault 처리 결과</span></button>
  </div>
  <div class="panel" id="status" hidden></div>
  <div class="panel">
    <div class="bar">
      <button class="primary" id="run-sel">선택한 테스트 실행</button>
      <button id="run-all">전체 실행</button>
      <label class="chk" id="mlfqs-wrap"><input type="checkbox" id="mlfqs">전체 실행에 mlfqs 포함</label>
      <span class="grow"></span>
      <a class="btn" id="view">결과 보기</a>
    </div>
    <div class="note" id="hint"></div>
    <div id="list"></div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = t => String(t ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const store = (k, v) => { try { v === undefined ? (v = localStorage.getItem(k)) : localStorage.setItem(k, v); } catch (e) { v = null; } return v; };
let TESTS = null, mode = ["userprog", "vm"].includes(store("tv-mode")) ? store("tv-mode") : "threads", busy = false, wasRunning = false;
const sel = { threads: new Set(), userprog: new Set(), vm: new Set() };
const PAGE = { threads: "viewer.html", userprog: "uprog.html", vm: "uprog.html?vm" };
const ALL_NOTE = {
  threads: "전체 실행은 alarm·priority·bench를 모두 돌려요. mlfqs는 체크했을 때만 돌려요. 처음 실행하면 2~3분 걸려요",
  userprog: "전체 실행은 multi-oom을 뺀 tests/userprog와 filesys/base를 모두 돌려요. 몇 분 걸려요",
  vm: "전체 실행은 tests/vm을 모두 VM 빌드로 돌려요. swap 테스트는 page fault가 많아 오래 걸려요. Project 2 테스트를 VM 빌드로 돌리려면 골라서 실행해 주세요",
};

// 이름 앞부분(args-, wait- ...)으로 묶음. 하나뿐인 것은 "그 외"로 모음
function bucket(ts, key = t => t.name) {
  const m = new Map(), etc = [];
  for (const t of ts) { const p = key(t).split("-")[0]; m.has(p) ? m.get(p).push(t) : m.set(p, [t]); }
  const out = [];
  for (const [p, v] of m) v.length > 1 ? out.push([p, v]) : etc.push(...v);
  if (etc.length) out.push(["그 외", etc]);
  return out;
}
function renderList() {
  document.querySelectorAll(".mode").forEach(b => { b.classList.toggle("on", b.dataset.m === mode); b.setAttribute("aria-pressed", b.dataset.m === mode); });
  $("mlfqs-wrap").hidden = mode !== "threads";
  $("view").href = PAGE[mode];
  $("hint").textContent = ALL_NOTE[mode];
  if (!TESTS) return;
  const gs = TESTS[mode] || [];
  const row = t => `<label class="t"><input type="checkbox" value="${esc(t.name)}"${sel[mode].has(t.name) ? " checked" : ""}>
      <span>${esc(t.name)}</span>${t.result ? `<b class="res ${t.result === "PASS" ? "pass" : "fail"}">${t.result === "PASS" ? "PASS" : "FAIL"}</b>` : ""}</label>`;
  const subs = gs.map(g => bucket(g.tests));
  $("list").innerHTML = gs.length ? gs.map((g, gi) => `<div class="group"><h3>${esc(g.group)} <button class="ghost" data-g="${gi}" data-v="1">전체 선택</button><button class="ghost" data-g="${gi}" data-v="0">해제</button></h3>
    ${subs[gi].map(([p, ts], si) => `<div class="sg">${subs[gi].length > 1 ? `<h4><button class="ghost" data-g="${gi}" data-s="${si}" title="이 묶음을 모두 고르거나 풀어요">${esc(p)}</button>
      <span class="note">${ts.length}개${ts.some(t => t.result) ? ` · PASS ${ts.filter(t => t.result === "PASS").length}` : ""}</span></h4>` : ""}
      <div class="grid">${ts.map(row).join("")}</div></div>`).join("")}</div>`).join("")
    : '<p class="note">테스트를 찾지 못했어요. pintos/ 폴더와 같은 높이에 tools/thread-viz/가 있는지 확인해 주세요</p>';
  $("list").querySelectorAll("input").forEach(c => c.onchange = () => { c.checked ? sel[mode].add(c.value) : sel[mode].delete(c.value); updButtons(); });
  $("list").querySelectorAll("h3 button").forEach(a => a.onclick = () => {
    for (const t of gs[+a.dataset.g].tests) a.dataset.v === "1" ? sel[mode].add(t.name) : sel[mode].delete(t.name);
    renderList();
  });
  // 묶음 이름을 누르면: 다 골라져 있으면 풀고, 아니면 다 고름
  $("list").querySelectorAll("h4 button").forEach(a => a.onclick = () => {
    const ts = subs[+a.dataset.g][+a.dataset.s][1], on = !ts.every(t => sel[mode].has(t.name));
    for (const t of ts) on ? sel[mode].add(t.name) : sel[mode].delete(t.name);
    renderList();
  });
  updButtons();
}
function updButtons() {
  const n = sel[mode].size;
  $("run-sel").textContent = n ? `선택한 테스트 실행 (${n}개)` : "선택한 테스트 실행";
  $("run-sel").disabled = busy || !n;
  $("run-all").disabled = busy;
}

async function api(path, body) {
  const r = await fetch(path, body === undefined ? { cache: "no-store" }
    : { method: "POST", headers: { "Content-Type": "application/json", "X-Thread-Viz": "1" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
async function run(all) {
  try {
    await api("/api/run", { mode, tests: all ? [] : [...sel[mode]], mlfqs: all && mode === "threads" && $("mlfqs").checked });
    store("tv-last", mode);
    poll();
  } catch (e) { showError(e.message); }
}
function showError(m) { $("status").hidden = false; $("status").innerHTML = `<b class="err"><i class="ic i-alert"></i>실행하지 못했어요.</b> ${esc(m)}`; }

// 진행 상황: run.sh가 쓰는 progress.json + 이 서버가 띄운 run.sh 출력 끝부분
async function poll() {
  let st, p = null;
  try { st = await api("/api/status"); } catch (e) {
    $("status").hidden = false; $("status").innerHTML = '<b class="err"><i class="ic i-alert"></i>서버에 연결하지 못했어요.</b> 터미널에서 tools/thread-viz/run.sh를 다시 실행해 주세요'; return;
  }
  try { p = await (await fetch("progress.json", { cache: "no-store" })).json(); } catch (e) {}
  busy = st.running; updButtons();
  const el = $("status");
  if (st.running) {
    wasRunning = true;
    el.hidden = false;
    const pct = p && p.running && p.total ? Math.round(p.done / p.total * 100) : 0;
    const ic = r => r.result === "PASS" ? ["ok", "check"] : r.result === "FAIL" ? ["fail", "x"] : ["none", "help"];
    const page = PAGE[(p && p.mode) || store("tv-last") || mode];
    el.innerHTML = `<div class="bar"><b>실행 중</b>${p && p.running ? ` ${p.done}/${p.total} (${pct}%) · 지금: <b>${esc(p.current)}</b>` : " · 빌드·준비 중"}
      <span class="grow"></span><a class="btn" href="${page}">뷰어에서 실시간으로 보기</a>${st.mine ? '<button class="danger" id="stop"><i class="ic i-stop"></i>중지 (지금까지 저장)</button>' : ""}</div>
      <div class="prog"><div class="track"><i style="width:${pct}%"></i></div></div>
      ${p && p.results ? `<div class="done">${p.results.map(r => `<span class="${ic(r)[0]}"><i class="ic i-${ic(r)[1]}"></i>${esc(r.test)}</span>`).join("")}</div>` : ""}
      ${st.mine ? "" : '<div class="note">터미널에서 돌린 실행이에요. 멈추려면 그 터미널에서 Ctrl-C를 눌러 주세요</div>'}
      ${st.log ? `<details${store("tv-log") === "1" ? " open" : ""} id="logd"><summary>run.sh 출력</summary><pre>${esc(st.log)}</pre></details>` : ""}`;
    if ($("stop")) $("stop").onclick = () => api("/api/stop", {}).catch(e => showError(e.message));
    if ($("logd")) $("logd").ontoggle = () => store("tv-log", $("logd").open ? "1" : "0");
    setTimeout(poll, 1000);
    return;
  }
  if (wasRunning || st.exit != null) {
    // 끝남: 결과 표시를 갱신하고 뷰어로 가는 버튼을 보여줌
    wasRunning = false;
    TESTS = await api("/api/tests").catch(() => TESTS); renderList();
    const page = PAGE[store("tv-last") || mode], failed = st.exit && st.exit !== 0 && st.exit !== 130;
    el.hidden = false;
    el.innerHTML = `<div class="bar"><span class="status-msg">${st.exit === 130 ? "중지했어요. 지금까지 모은 기록은 저장했어요" : failed ? '<b class="err"><i class="ic i-alert"></i>실행하지 못했어요.</b> 빌드 에러 등은 아래 출력에서 확인해 주세요' : "<b>완료</b>"}</span>
      <span class="grow"></span><a class="btn primary" href="${page}">결과 보기</a></div>
      ${st.log ? `<details${failed ? " open" : ""}><summary>run.sh 출력</summary><pre>${esc(st.log)}</pre></details>` : ""}`;
  }
}

document.querySelectorAll(".mode").forEach(b => b.onclick = () => { mode = b.dataset.m; store("tv-mode", mode); renderList(); });
$("run-sel").onclick = () => run(false);
$("run-all").onclick = () => run(true);
renderList();
api("/api/tests").then(t => { TESTS = t; renderList(); }).catch(() => {
  $("list").innerHTML = '<p class="note">서버 API에 연결하지 못했어요. 이 페이지는 tools/thread-viz/run.sh가 띄운 서버(http://localhost:8000)로 열어 주세요</p>';
});
poll();
</script>
</body>
</html>
